name: Release Packwire Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión a publicar (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Compilación en Windows: .exe portable + Setup (Inno Setup)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar binarios Rust de Windows
        run: |
          cargo build --release --manifest-path packwire-rs/Cargo.toml --bins

      - name: Preparar binarios Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packwire-rs/target/release/packwire.exe dist/packwire.exe -Force
          Copy-Item packwire-rs/target/release/packwirew.exe dist/packwirew.exe -Force

      - name: Empaquetar ZIP Portable de Windows
        shell: pwsh
        run: |
          $bundle = "dist\packwire-windows-x64"
          New-Item -ItemType Directory -Force -Path "$bundle\web" | Out-Null
          Copy-Item dist\packwire.exe "$bundle\packwire.exe" -Force
          Copy-Item dist\packwirew.exe "$bundle\packwirew.exe" -Force
          Copy-Item assets\web\* "$bundle\web" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$bundle\manifests" | Out-Null
          Copy-Item assets\manifests\*.json "$bundle\manifests" -Force
          Compress-Archive -Path "$bundle\*" -DestinationPath dist\packwire-windows-x64.zip -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
            echo $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Compilar Instalador Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Renombrar Instalador con Versión
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name || 'latest' }}" }
          if (Test-Path dist\Packwire-Setup.exe) {
            Copy-Item dist\Packwire-Setup.exe "dist\Packwire-Setup-$tag.exe"
          }

      - name: Subir Artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Packwire-Setup*.exe
            dist/packwire-windows-x64.zip
            dist/packwire.exe
            dist/packwirew.exe
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Compilación en Linux: Binario ELF portable tar.gz
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar binarios Rust de Linux
        run: |
          cargo build --release --manifest-path packwire-rs/Cargo.toml --bins

      - name: Empaquetar tar.gz de Linux
        run: |
          mkdir -p dist/packwire-linux-x64/web
          cp packwire-rs/target/release/packwire dist/packwire-linux-x64/packwire
          cp packwire-rs/target/release/packwirew dist/packwire-linux-x64/packwirew
          cp -R assets/web/. dist/packwire-linux-x64/web/
          mkdir -p dist/packwire-linux-x64/manifests
          cp assets/manifests/*.json dist/packwire-linux-x64/manifests/
          chmod +x dist/packwire-linux-x64/packwire dist/packwire-linux-x64/packwirew
          tar -czvf dist/packwire-linux-x64.tar.gz -C dist packwire-linux-x64

      - name: Subir Artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/packwire-linux-x64.tar.gz
          retention-days: 1

  # -------------------------------------------------------------
  # 3. Compilación en macOS: Binario Mach-O portable tar.gz
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar binarios Rust de macOS
        run: |
          cargo build --release --manifest-path packwire-rs/Cargo.toml --bins

      - name: Empaquetar tar.gz de macOS
        run: |
          mkdir -p dist/packwire-macos-universal/web
          cp packwire-rs/target/release/packwire dist/packwire-macos-universal/packwire
          cp packwire-rs/target/release/packwirew dist/packwire-macos-universal/packwirew
          cp -R assets/web/. dist/packwire-macos-universal/web/
          mkdir -p dist/packwire-macos-universal/manifests
          cp assets/manifests/*.json dist/packwire-macos-universal/manifests/
          chmod +x dist/packwire-macos-universal/packwire dist/packwire-macos-universal/packwirew
          tar -czvf dist/packwire-macos-universal.tar.gz -C dist packwire-macos-universal

      - name: Subir Artefactos de macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/packwire-macos-universal.tar.gz
          retention-days: 1

  # -------------------------------------------------------------
  # 4. Publicar GitHub Release con Checksums SHA-256
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Crear Directorio de Descarga
        run: mkdir -p release-assets

      - name: Descargar Artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets
          merge-multiple: true

      - name: Descargar Artefactos de Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets
          merge-multiple: true

      - name: Descargar Artefactos de macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets
          merge-multiple: true

      - name: Generar Sumas de Verificación SHA-256
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determinar Etiqueta (Tag)
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Packwire ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
