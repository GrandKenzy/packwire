name: Release Packwire para Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Etiqueta de la versión que se publicará"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Windows x64
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar CLI y GUI
        run: cargo build --release --manifest-path packwire-rs/Cargo.toml --bins

      - name: Preparar paquete portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packwire-windows-x64\web | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packwire-windows-x64\manifests | Out-Null

          Copy-Item packwire-rs\target\release\packwire.exe dist\packwire.exe -Force
          Copy-Item packwire-rs\target\release\packwirew.exe dist\packwirew.exe -Force
          Copy-Item dist\packwire.exe dist\packwire-windows-x64\packwire.exe -Force
          Copy-Item dist\packwirew.exe dist\packwire-windows-x64\packwirew.exe -Force
          Copy-Item assets\web\* dist\packwire-windows-x64\web -Recurse -Force
          Copy-Item assets\manifests\*.json dist\packwire-windows-x64\manifests -Force
          Copy-Item README.md dist\packwire-windows-x64\README.md -Force

          Compress-Archive `
            -Path dist\packwire-windows-x64\* `
            -DestinationPath dist\packwire-windows-x64.zip `
            -Force

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss'

      - name: Nombrar instalador con la versión
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ github.event.inputs.tag_name || 'latest' }}"
          }

          Copy-Item dist\Packwire-Setup.exe "dist\Packwire-Setup-$tag.exe" -Force

      - name: Publicar artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Packwire-Setup-*.exe
            dist/packwire-windows-x64.zip
            dist/packwire.exe
            dist/packwirew.exe
          retention-days: 1

  publish-release:
    name: Publicar release estable
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Generar sumas SHA-256
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Determinar etiqueta
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag_name || 'v1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release de Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Packwire ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
