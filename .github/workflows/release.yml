name: Release Packwire Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión a publicar (ej. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Compilación en Windows: .exe portable + Setup (Inno Setup)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller wheel

      - name: Compilar packwire.exe con PyInstaller
        run: |
          python -m packwire build --exe

      - name: Empaquetar ZIP Portable de Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist\packwire.exe -DestinationPath dist\packwire-windows-x64.zip -Force

      - name: Instalar Inno Setup
        uses: Minisug/inno-setup-action@v2
        with:
          path: installer.iss

      - name: Renombrar Instalador con Versión
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name || 'latest' }}" }
          if (Test-Path dist\Packwire-Setup.exe) {
            Copy-Item dist\Packwire-Setup.exe "dist\Packwire-Setup-$tag.exe"
          }

      - name: Subir Artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Packwire-Setup*.exe
            dist/packwire-windows-x64.zip
            dist/packwire.exe
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Compilación en Linux: Binario ELF portable tar.gz
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias del Sistema y PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential patchelf
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller wheel

      - name: Compilar binario nativo de Linux
        run: |
          python -m packwire build --exe

      - name: Empaquetar tar.gz de Linux
        run: |
          chmod +x dist/packwire
          tar -czvf dist/packwire-linux-x64.tar.gz -C dist packwire

      - name: Subir Artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/packwire-linux-x64.tar.gz
          retention-days: 1

  # -------------------------------------------------------------
  # 3. Compilación en macOS: Binario Mach-O portable tar.gz
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller wheel

      - name: Compilar binario nativo de macOS
        run: |
          python -m packwire build --exe

      - name: Empaquetar tar.gz de macOS
        run: |
          chmod +x dist/packwire
          tar -czvf dist/packwire-macos-universal.tar.gz -C dist packwire

      - name: Subir Artefactos de macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/packwire-macos-universal.tar.gz
          retention-days: 1

  # -------------------------------------------------------------
  # 4. Publicar GitHub Release con Checksums SHA-256
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Crear Directorio de Descarga
        run: mkdir -p release-assets

      - name: Descargar Artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Descargar Artefactos de Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Descargar Artefactos de macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: Generar Sumas de Verificación SHA-256
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determinar Etiqueta (Tag)
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'v0.1.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Packwire ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
