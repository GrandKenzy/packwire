[package]
name = "packwire-rs"
version = "1.2.0"
edition = "2021"
publish = false

[[bin]]
name = "packwire"
path = "src/main.rs"

[[bin]]
name = "packwirew"
path = "src/bin/packwirew.rs"

[dependencies]
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = "2"
xz2 = "0.1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
time = { version = "0.3", features = ["local-offset"] }
walkdir = "2"
semver = "1"

[target.'cfg(windows)'.dependencies]
tao = "0.37.2"
wry = "0.57.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
