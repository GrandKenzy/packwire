[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packwire"
version = "0.1.4"
description = "Gestor y descargador moderno, elegante y portátil de paquetes para Windows, Linux y macOS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Packwire Team" }
]
keywords = ["package manager", "windows", "linux", "macos", "installer", "portable", "dev-tools", "cli", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]

dependencies = [
    "pywebview>=4.0.0",
    "bottle>=0.12.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
    "wheel>=0.40.0"
]

[project.scripts]
packwire = "packwire.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packwire*"]

[tool.setuptools.package-data]
"packwire.core" = [
    "manifests/*.json",
    "gui/web/*.*",
    "gui/web/global/*.css",
    "gui/web/guides/*.html"
]
